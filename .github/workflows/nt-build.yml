name: nt build (web static)

# Builds the AFFiNE web + mobile frontends from this fork and publishes them as
# a release tarball. The nettletontribe server layers it (plus branding) onto
# the official server image of the same version, so no server/Rust build.

on:
  push:
    branches:
      - 'nt/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.27.4

concurrency:
  group: nt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, data-view tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=14384
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - name: Lint
        run: yarn lint:ox
      - name: Format
        run: yarn lint:format
      - name: Unit tests (data-view)
        working-directory: blocksuite/affine/data-view
        run: yarn vitest run
      - name: Typecheck
        run: yarn typecheck

  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: web
            package: '@affine/web'
            dist: packages/frontend/apps/web/dist
          - name: mobile
            package: '@affine/mobile'
            dist: packages/frontend/apps/mobile/dist
    env:
      NODE_OPTIONS: --max-old-space-size=14384
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ env.APP_VERSION }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Build
        run: yarn affine ${{ matrix.app.package }} build
        env:
          BUILD_TYPE: stable
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}
          path: ${{ matrix.app.dist }}
          if-no-files-found: error

  release:
    name: Publish static bundle
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: static
      - uses: actions/download-artifact@v4
        with:
          name: mobile
          path: static/mobile
      - name: Package
        run: |
          tar -czf nt-affine-static.tar.gz static
          sha256sum nt-affine-static.tar.gz > nt-affine-static.tar.gz.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nt-v${{ env.APP_VERSION }}-${{ github.run_number }}
        run: |
          gh release create "$TAG" nt-affine-static.tar.gz nt-affine-static.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "AFFiNE $APP_VERSION web+mobile static built from ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Layer onto ghcr.io/toeverything/affine:$APP_VERSION."
